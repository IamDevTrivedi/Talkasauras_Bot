name: talkasauras-prod

services:
    bot:
        image: ghcr.io/iamdevtrivedi/talkasauras_bot:latest
        build:
            context: .
            dockerfile: Dockerfile
        container_name: talkasauras-prod-bot
        restart: unless-stopped
        ports:
            - "5004:5000"
        env_file:
            - .env.production
        depends_on:
            redis:
                condition: service_healthy
        sysctls:
            - net.ipv6.conf.all.disable_ipv6=1

    redis:
        image: redis:8-alpine
        container_name: talkasauras-prod-redis
        restart: unless-stopped
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD-SHELL", "redis-cli ping"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s

    ollama:
        image: ollama/ollama:latest
        container_name: talkasauras-prod-ollama
        restart: unless-stopped
        profiles:
            - local-ollama
        ports:
            - "5005:11434"
        volumes:
            - ollama-data:/root/.ollama
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:11434 || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

volumes:
    redis-data:
    ollama-data:
